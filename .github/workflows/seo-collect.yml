name: SEO snapshot (Friday evening)

# Layer 1 of the SEO loop: fetch the data and commit it as JSON in seo-agent/data/<week>/.
# Layer 2 (the judgement) is the Claude routine on Saturday morning (/seo-weekly), which only reads the repo.
# 21:00 UTC = 23:00 Berlin in summer time, 22:00 in winter; both before Saturday 06:00.
on:
  schedule:
    - cron: '0 21 * * 5'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Also fetch 16 months of GSC daily totals (once)'
        type: boolean
        default: false
      force_geo:
        description: 'Run GEO in an odd week too'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seo-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Snapshot
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        run: |
          node scripts/seo-agent/collect.mjs \
            ${{ inputs.backfill && '--backfill' || '' }} \
            ${{ inputs.force_geo && '--force-geo' || '' }}
      - name: Page triage
        run: node scripts/seo-agent/pages.mjs
      - name: Health score
        run: node scripts/seo-agent/score.mjs
      - name: Commit
        run: |
          git config user.name "seo-agent"
          git config user.email "seo-agent@users.noreply.github.com"
          git add seo-agent/data seo-agent/pages.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          WEEK=$(node -e "import('./scripts/seo-agent/lib/dates.mjs').then(m => console.log(m.isoWeek()))")
          git commit -m "chore(seo): snapshot $WEEK"
          git pull --rebase origin main
          git push
